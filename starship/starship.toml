"$schema" = 'https://starship.rs/config-schema.json'

# Ajisai Rainbow 用の Starship 設定
# 色は 16 色の番号（1〜6）で書き、端末のテーマから取る。Ghostty が明暗を切り替えると、プロンプトも一緒に変わる。
# 帯の文字は inverted（反転）で、端末の背景色になる。暗い版・明るい版のどちらでも対比 4.3 以上。
# 帯の並び: 紫 → 青 → 空色 → 葉の緑。絵の紫と青の紫陽花、空、葉の順。絵にないピンクと黄は帯に使わない

format = """
[](fg:5)\
$os\
$username\
[](fg:5 bg:4)\
$directory\
[](fg:4 bg:6)\
$git_branch\
$git_status\
[](fg:6 bg:2)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$conda\
[ ](fg:2)\
$time\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "fg:5 inverted"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "fg:5 inverted"
style_root = "bold fg:5 inverted"
format = '[ $user ]($style)'

[directory]
style = "fg:4 inverted"
read_only_style = "fg:4 inverted"
format = "[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:6 inverted"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:6 inverted"
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕'
up_to_date = '✓'
untracked = '?'
stashed = '$'
modified = '!${count}'
renamed = '»'
deleted = '✘'
format = '[($all_status$ahead_behind )]($style)'

[nodejs]
symbol = ""
style = "fg:2 inverted"
format = '[ $symbol( $version) ]($style)'

[c]
symbol = " "
style = "fg:2 inverted"
format = '[ $symbol( $version) ]($style)'

[rust]
symbol = ""
style = "fg:2 inverted"
format = '[ $symbol( $version) ]($style)'

[golang]
symbol = ""
style = "fg:2 inverted"
format = '[ $symbol( $version) ]($style)'

[php]
symbol = ""
style = "fg:2 inverted"
format = '[ $symbol( $version) ]($style)'

[java]
symbol = " "
style = "fg:2 inverted"
format = '[ $symbol( $version) ]($style)'

[kotlin]
symbol = ""
style = "fg:2 inverted"
format = '[ $symbol( $version) ]($style)'

[haskell]
symbol = ""
style = "fg:2 inverted"
format = '[ $symbol( $version) ]($style)'

[python]
symbol = ""
style = "fg:2 inverted"
format = '[ $symbol( $version)(\(#$virtualenv\)) ]($style)'

[docker_context]
symbol = ""
style = "fg:2 inverted"
format = '[ $symbol( $context) ]($style)'

[conda]
symbol = "  "
style = "fg:2 inverted"
format = '[ $symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "fg:8"
format = '[ $time]($style) '

[line_break]
disabled = true

[character]
disabled = true
success_symbol = '[❯](bold fg:2)'
error_symbol = '[❯](bold fg:1)'
vimcmd_symbol = '[❮](bold fg:2)'
vimcmd_replace_one_symbol = '[❮](bold fg:5)'
vimcmd_replace_symbol = '[❮](bold fg:5)'
vimcmd_visual_symbol = '[❮](bold fg:6)'

[cmd_duration]
show_milliseconds = true
format = " in [$duration]($style) "
style = "fg:5"
disabled = true
show_notifications = true
min_time_to_notify = 45000
